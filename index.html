<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self'; connect-src 'self' https://accounts.google.com https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <title>畜産発注システム</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#main" aria-label="畜産発注システム ホーム">
      <span class="brand-mark" aria-hidden="true">畜</span>
      <span><strong>畜産発注</strong><small>店舗・本部・倉庫</small></span>
    </a>
    <div class="topbar-center"><span class="live-dot"></span><span id="status-label">接続を準備しています</span></div>
    <div class="account-area">
      <a class="guide-button" href="guide.html" aria-label="利用ガイドを開く"><span aria-hidden="true">?</span>利用ガイド</a>
      <span id="account-label" class="account-label">未ログイン</span>
      <button id="signout-button" class="button button-quiet" type="button" hidden>ログアウト</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="sidebar-label">メニュー</div>
      <nav>
        <a class="nav-link is-current" href="#main"><span class="nav-icon" aria-hidden="true">▦</span>発注一覧</a>
      </nav>
      <section class="side-note" id="deadline-note" hidden>
        <span class="side-note-icon" aria-hidden="true">✓</span>
        <strong>締切前に確認 <a class="help-icon" href="guide.html#deadline" title="締切と注文確定の説明" aria-label="締切と注文確定の説明を開く">?</a></strong>
        <p id="deadline-sidebar">ログイン後に対象月の締切を表示します。</p>
      </section>
      <div class="sidebar-footer">社内専用システム</div>
    </aside>

    <main id="main" class="main-content">
      <section class="page-heading">
        <div>
          <div class="eyebrow">ORDER MANAGEMENT</div>
          <h1>畜産 発注一覧</h1>
          <p class="page-subtitle">店舗の注文を、倉庫へリアルタイムに共有します。</p>
        </div>
        <div id="period-control" class="period-control" hidden>
          <label for="month-select">対象月 <a class="help-icon" href="guide.html#month" title="対象月の切替について" aria-label="対象月の説明を開く">?</a></label>
          <select id="month-select" aria-label="対象月"></select>
          <button id="print-button" class="button button-secondary" type="button">印刷</button>
        </div>
      </section>

      <section id="notice" class="notice notice-info" role="status" aria-live="polite" hidden>
        <span class="notice-icon" aria-hidden="true">i</span>
        <div><strong>会社アカウントでログインしてください</strong><p>認証前は画面の骨格と利用ガイドだけを表示します。</p></div>
      </section>

      <section id="login-panel" class="login-panel" aria-labelledby="login-title">
        <div class="login-illustration" aria-hidden="true"><span>畜</span><i>●</i></div>
        <div class="login-copy">
          <div class="eyebrow">SECURE SIGN IN</div>
          <h2 id="login-title">社内アカウントでログイン</h2>
          <p>会社指定のGoogleアカウントでログインしてください。</p>
          <button id="login-button" class="button button-primary" type="button" disabled>ログイン準備中</button>
          <p id="login-help" class="login-help">接続先を確認しています。</p>
        </div>
      </section>

      <section id="workspace" hidden>
        <div class="summary-strip" id="summary-strip"></div>
        <section class="toolbar" aria-label="一覧操作">
          <div class="view-tabs" role="tablist" aria-label="表示方法">
            <button class="view-tab is-active" type="button" data-view="week" role="tab" aria-selected="true">週ごと</button>
            <button class="view-tab" type="button" data-view="month" role="tab" aria-selected="false">月間合計</button>
          </div>
          <div class="search-area"><div class="search-box"><span aria-hidden="true">⌕</span><input id="product-search" type="search" placeholder="商品名・メーカー・規格・JANで検索" aria-label="商品名・メーカー・規格・JANで検索" autocomplete="off" aria-controls="search-suggestions" aria-expanded="false"><span class="shortcut">商品検索</span><a class="help-icon" href="guide.html#search" title="商品検索と表記ゆれの説明" aria-label="商品検索の説明を開く">?</a></div><div id="search-suggestions" class="search-suggestions" hidden></div></div>
          <div id="role-actions" class="role-actions"></div>
        </section>
        <div id="warehouse-cap-control" class="setting-card" hidden></div>
        <div id="order-content" class="order-content" aria-live="polite"></div>
      </section>

      <footer class="page-footer"><span>畜産 発注管理</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>
</body>
</html>
