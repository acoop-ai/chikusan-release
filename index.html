<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw='; connect-src 'self' https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>畜産発注システム</title>
  <script src="oauth-return.js?v=livestock-order-api-0.2.4"></script>
  <link rel="stylesheet" href="styles.css?v=livestock-order-api-0.2.4">
  <script src="config.js?v=livestock-order-api-0.2.4" defer></script>
  <script src="login.js?v=livestock-order-api-0.2.4" defer></script>
  <script src="search-norm.js?v=livestock-order-api-0.2.4" defer></script>
  <script src="search-words.js?v=livestock-order-api-0.2.4" defer></script>
  <script src="product-sheet.js?v=livestock-order-api-0.2.4" defer></script>
  <script src="order-book.js?v=livestock-order-api-0.2.4" defer></script>
  <script src="app.js?v=livestock-order-api-0.2.4" defer></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#main" aria-label="畜産発注システム ホーム">
      <span class="brand-mark" aria-hidden="true">畜</span>
      <span><strong>畜産発注</strong></span>
    </a>
    <div class="topbar-center"><span class="live-dot"></span><span id="status-label">接続を準備しています</span></div>
    <div class="account-area">
      <a class="guide-button" href="guide.html" aria-label="利用ガイドを開く"><span aria-hidden="true">?</span>利用ガイド</a>
      <span id="account-label" class="account-label">未ログイン</span>
      <button id="signout-button" class="button button-quiet" type="button" hidden>ログアウト</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="sidebar-label">メニュー</div>
      <nav>
        <a class="nav-link is-current" href="#main"><span class="nav-icon" aria-hidden="true">▦</span>発注一覧</a>
      </nav>
      <div class="sidebar-footer">社内専用システム</div>
    </aside>

    <main id="main" class="main-content">
      <section class="page-heading">
        <div class="page-title">
          <h1>畜産 発注一覧</h1>
          <p class="page-subtitle">店舗の注文を、そのまま倉庫へ届けます。</p>
        </div>
        <div id="period-control" class="period-control" hidden>
          <label for="month-select">対象月 <a class="help-icon" href="guide.html#month" title="対象月の切り替えについて" aria-label="対象月の説明を開く">?</a></label>
          <select id="month-select" aria-label="対象月"></select>
          <button id="print-button" class="button button-secondary" type="button">印刷</button>
          <button id="excel-button" class="button button-secondary" type="button" hidden>Excel でダウンロード</button>
        </div>
      </section>

      <section id="notice" class="notice notice-info" role="status" aria-live="polite" hidden>
        <span class="notice-icon" aria-hidden="true">i</span>
        <div><strong>お知らせ</strong><p></p></div>
      </section>

      <section id="login-panel" class="login-panel" aria-labelledby="login-title">
        <div class="login-illustration" aria-hidden="true"><span>畜</span><i>●</i></div>
        <div class="login-copy">
          <div class="eyebrow">SECURE SIGN IN</div>
          <h2 id="login-title">会社のアカウントでログイン</h2>
          <p>本部・店舗の Google アカウントでログインしてください。「Googleでログイン」を押すと、Google の画面へ移ってから、この画面に戻ります。</p>
          <div id="inapp-warning" class="inapp-warning" role="alert" hidden></div>
          <button id="login-button" class="button button-primary button-login" type="button" disabled>ログインの準備中</button>
          <p id="login-help" class="login-help" aria-live="polite">接続先を確かめています。</p>
        </div>
      </section>

      <section id="workspace" hidden>
        <div id="print-head" class="print-only" aria-hidden="true"></div>
        <div class="summary-line" id="summary-strip"></div>
        <p id="role-notice" class="role-notice" hidden></p>
        <div id="lead-warning" class="lead-warning" role="status" hidden></div>
        <section class="toolbar" aria-label="一覧の操作">
          <div class="view-tabs" role="tablist" aria-label="表示の切り替え">
            <button class="view-tab is-active" type="button" data-view="week" role="tab" aria-selected="true">週ごと</button>
            <button class="view-tab" type="button" data-view="month" role="tab" aria-selected="false">月間合計</button>
          </div>
          <div class="search-area"><div class="search-box"><span aria-hidden="true">⌕</span><input id="product-search" type="search" placeholder="商品を探す（ひらがな・ローマ字・JANでも）" aria-label="商品名・メーカー・規格・JANで探す" autocomplete="off" aria-controls="search-suggestions" aria-expanded="false"><a class="help-icon" href="guide.html#search" title="商品の探し方の説明" aria-label="商品の探し方の説明を開く">?</a></div><div id="search-suggestions" class="search-suggestions" hidden></div></div>
          <div id="role-actions" class="role-actions"></div>
        </section>
        <div id="order-content" class="order-content" aria-live="polite"></div>
        <div id="print-all" class="print-only" aria-hidden="true"></div>
      </section>

      <footer class="page-footer"><span>畜産 発注管理</span><span id="app-version" class="app-version">版 livestock-order-api-0.2.4</span></footer>
    </main>
  </div>
  <div id="progress" class="progress-overlay" role="status" aria-live="polite" hidden><div><i aria-hidden="true"></i><span>読み込んでいます…</span></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>
</body>
</html>
